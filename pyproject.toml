[project]
name = "sikili-webapp"
version = "0.1.0"
description = "FastAPI service (stack Sikili)"
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "jinja2>=3.1.0",
]

# FastAPI application: no PyPI publication; only dependencies (no package installed).
[tool.uv]
package = false
