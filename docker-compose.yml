name: sikili-stack

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    # write /etc/odoo/odoo.conf at startup (root), then run Odoo as user odoo
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:?Define ODOO_ADDONS_PATH in .env}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?Define ODOO_ADMIN_PASSWD in .env}
      ODOO_RC: /etc/odoo/odoo.conf
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./docker/odoo/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    # CMD "odoo" must be explicit: otherwise $@ can be empty and /entrypoint.sh fails.
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["odoo"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8069)); s.close()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 360s
    networks:
      - app

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      odoo:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PGHOST: ${POSTGRES_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:-odoo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      ODOO_URL: http://odoo:8069
      ODOO_DATABASE: ${ODOO_DATABASE:-postgres}
      ODOO_LOGIN: ${ODOO_LOGIN:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:?Set ODOO_PASSWORD in .env for Odoo XML-RPC}
    networks:
      - app
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

volumes:
  postgres_data:
  odoo_data:

networks:
  app:
    driver: bridge
