# Stack: PostgreSQL 16 + Odoo 18 + FastAPI
# Requirements: copy .env.example to .env and fill POSTGRES_PASSWORD (strong password).
#
# Best practices applied:
# - Internal application network: PostgreSQL is not exposed on the host.
# - Healthchecks: pg_isready (TCP 127.0.0.1) for Postgres ; HTTP for Odoo (long startup → start_period).
# - depends_on + condition: service_healthy to avoid races at startup.
# - Secrets via file .env (do not commit) ; passwords required via ${VAR:?message}.
# - Named volumes for DB and Odoo filestore data (survives restarts).
# - Postgres: reasonable settings for a small server / dev (adjust according to RAM).

name: sikili-stack

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Character set consistent with Odoo / UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Perf: reasonable settings for a small container (SSD). Adjust in prod according to RAM.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    healthcheck:
      # TCP on 127.0.0.1 (avoid marking healthy too soon via socket-only checks)
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    # write /etc/odoo/odoo.conf at startup (root), then run Odoo as user odoo
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      # Gevent / bus (real-time); map for full Odoo behaviour (main UI still uses 8069)
      - "8072:8072"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:?Define ODOO_ADDONS_PATH in .env}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?Define ODOO_ADMIN_PASSWD in .env}
      ODOO_RC: /etc/odoo/odoo.conf
    volumes:
      - ./addons:/mnt/extra-addons
      # Persistence filestore / application data Odoo (essential for non-trivial tests)
      - odoo_data:/var/lib/odoo
      - ./docker/odoo/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    # CMD "odoo" must be explicit: otherwise $@ can be empty and /entrypoint.sh fails.
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["odoo"]
    healthcheck:
      # TCP on 8069: does not depend on HTTP code (/web can return 302/404 depending on the database).
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8069)); s.close()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 360s
    networks:
      - app

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      odoo:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Preferred to a unique DATABASE_URL: no problem with encoding special characters in the password
      PGHOST: ${POSTGRES_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:-odoo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      # Odoo XML-RPC (same DB name as in Odoo; login = Odoo user, not Postgres role)
      ODOO_URL: http://odoo:8069
      ODOO_DATABASE: ${ODOO_DATABASE:-postgres}
      ODOO_LOGIN: ${ODOO_LOGIN:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:?Set ODOO_PASSWORD in .env for Odoo XML-RPC}
    networks:
      - app
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

volumes:
  postgres_data:
  odoo_data:

networks:
  app:
    driver: bridge
